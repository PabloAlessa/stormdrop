# Integración y despliegue continuo: comprueba el código en cada push y PR, y publica en GitHub Pages desde main.
name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Comprobaciones de calidad
        run: python tools/check.py
      - name: Build de producción
        run: python tools/build.py ${{ vars.TELEMETRY_URL && format('--telemetry {0}', vars.TELEMETRY_URL) || '' }}
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: stormdrop-html5
          path: dist/*.zip

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
